<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 20 706 160" role="img" aria-label="TurkChan">
  <!--
    TurkChan kelime logosu.
    "TURK" gümüş gradyanlı, "CHAN" kırmızı gradyanlı.
    Üstte ve altta kırmızı accent çizgileri, tam ortada bir nokta.

    Geometri (yol verisi ölçülerek doğrulandı):
      harfler  x 112..818, y 33..142
      çizgiler x 150..788, y 21.5..178.5
    viewBox tam bunun etrafını sarar: merkez x=465, y=100.
    Önceki viewBox (760x200) çizimi kırpmıyordu ama sağdaki "N" harfi
    kırpılıyor ve logo sola kayıyordu; bu değer içeriği tam ortalar.
  -->
  <defs>
    <linearGradient id="tc-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6fa"/>
      <stop offset="45%" stop-color="#d8dce6"/>
      <stop offset="100%" stop-color="#8f95a3"/>
    </linearGradient>
    <linearGradient id="tc-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4a63"/>
      <stop offset="50%" stop-color="#ff1233"/>
      <stop offset="100%" stop-color="#c20d26"/>
    </linearGradient>
    <linearGradient id="tc-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b0f1e"/>
      <stop offset="18%" stop-color="#ff1233"/>
      <stop offset="82%" stop-color="#ff1233"/>
      <stop offset="100%" stop-color="#6b0f1e"/>
    </linearGradient>
  </defs>

  <!-- Üst accent çizgileri + orta nokta (x=469 merkez) -->
  <g>
    <rect x="150" y="26" width="300" height="7" rx="3.5" fill="url(#tc-bar)"/>
    <rect x="488" y="26" width="300" height="7" rx="3.5" fill="url(#tc-bar)"/>
    <circle cx="469" cy="29.5" r="8" fill="url(#tc-red)"/>
  </g>

  <!-- TURK (x 120..469) -->
  <g fill="url(#tc-silver)">
    <path d="M120 62h44l-26 44h44v14h-70l26-44h-18z"/>
    <path d="M204 120V62h16l30 38V62h16v58h-16l-30-38v38z"/>
    <path d="M300 120l24-58h18l24 58h-17l-4-11h-25l-4 11zm25-24h16l-8-21z"/>
    <path d="M384 120V62h50v14h-34v10h30v13h-30v7h35v14z"/>
  </g>

  <!-- CHAN (x 470..818) -->
  <g fill="url(#tc-red)">
    <path d="M470 120l22-26c6 6 12 9 19 9 8 0 12-3 12-8 0-13-34-8-34-32 0-13 11-22 27-22 11 0 20 3 27 10l-16 16c-5-4-9-6-14-6-6 0-9 3-9 7 0 12 34 7 34 32 0 14-12 23-30 23-12 0-23-4-31-11z"/>
    <path d="M560 120V62h34c22 0 34 10 34 29s-12 29-34 29zm16-13h17c14 0 21-6 21-16s-7-16-21-16h-17z"/>
    <path d="M654 62h30l15 21 15-21h30l-31 40 33 38h-31l-16-20-16 20h-30l33-38z"/>
    <path d="M762 62h42l14 26-14 32h-42l-14-32zm21 16-9 26h18l9-26z"/>
  </g>

  <!-- Alt accent çizgileri + orta nokta -->
  <g>
    <rect x="150" y="167" width="300" height="7" rx="3.5" fill="url(#tc-bar)"/>
    <rect x="488" y="167" width="300" height="7" rx="3.5" fill="url(#tc-bar)"/>
    <circle cx="469" cy="170.5" r="8" fill="url(#tc-red)"/>
  </g>
</svg>
