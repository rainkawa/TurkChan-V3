<svg xmlns="http://www.w3.org/2000/svg" width="57.79" height="24" viewBox="0 0 57.79 24" role="img" aria-label="Angel">
  <title>Angel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF4DA"/>
      <stop offset="1" stop-color="#FBE5AF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chip"><rect x=".5" y=".5" width="56.79" height="23" rx="7"/></clipPath>
  </defs>
  <style>
    .sheen { animation: sheen 2.8s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes sheen {
      0% { transform: translateX(-20px); opacity: 0 }
      20%, 80% { opacity: .55 }
      100% { transform: translateX(91.79px); opacity: 0 }
    }
    @keyframes pulse { 0%, 100% { opacity: 0 } 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .sheen, .pulse { animation: none } }
  </style>
  <g clip-path="url(#chip)">
    <rect x=".5" y=".5" width="56.79" height="23" rx="7" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="56.79" height="11.5" fill="url(#gloss)"/>
    <g class="sheen" opacity="0"><rect x="-10" y="-8" width="12" height="40" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>
  <rect x=".5" y=".5" width="56.79" height="23" rx="7" fill="none" stroke="#EDC877" stroke-width="1"/>
  <rect class="pulse" x=".8" y=".8" width="55.19" height="22.4" rx="6.2" fill="none" stroke="#F59E0B" stroke-width="1.4" opacity="0"/>
  <g transform="translate(4.5 5.5) scale(0.5416667)" fill="none" stroke="#C2740A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z" /> <path d="M16 8 2 22" /> <path d="M17.488 15H9" />
  </g>
  <text x="22" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing=".01em" fill="#8A5B06" textLength="30.29" lengthAdjust="spacingAndGlyphs">Angel</text>
</svg>
