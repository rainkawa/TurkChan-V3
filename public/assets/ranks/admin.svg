  </g>
  <text x="22" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing=".01em" fill="#7A1A17" textLength="33.85" lengthAdjust="spacingAndGlyphs">Admin</text>
</svg>
