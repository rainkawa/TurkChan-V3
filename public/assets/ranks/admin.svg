<svg xmlns="http://www.w3.org/2000/svg" width="61.35" height="24" viewBox="0 0 61.35 24" role="img" aria-label="Admin">
  <title>Admin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE2DE"/>
      <stop offset="1" stop-color="#F7C0B8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chip"><rect x=".5" y=".5" width="60.35" height="23" rx="7"/></clipPath>
  </defs>
  <style>
    .sheen { animation: sheen 2.8s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes sheen {
      0% { transform: translateX(-20px); opacity: 0 }
      20%, 80% { opacity: .55 }
      100% { transform: translateX(95.35px); opacity: 0 }
    }
    @keyframes pulse { 0%, 100% { opacity: 0 } 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .sheen, .pulse { animation: none } }
  </style>
  <g clip-path="url(#chip)">
    <rect x=".5" y=".5" width="60.35" height="23" rx="7" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="60.35" height="11.5" fill="url(#gloss)"/>
    <g class="sheen" opacity="0"><rect x="-10" y="-8" width="12" height="40" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>
  <rect x=".5" y=".5" width="60.35" height="23" rx="7" fill="none" stroke="#EB9082" stroke-width="1"/>
  <rect class="pulse" x=".8" y=".8" width="58.75" height="22.4" rx="6.2" fill="none" stroke="#EF4444" stroke-width="1.4" opacity="0"/>
  <g transform="translate(4.5 5.5) scale(0.5416667)" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
