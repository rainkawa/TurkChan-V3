<svg xmlns="http://www.w3.org/2000/svg" width="49.24" height="24" viewBox="0 0 49.24 24" role="img" aria-label="God">
  <title>God</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE5EA"/>
      <stop offset="1" stop-color="#F8C8D3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chip"><rect x=".5" y=".5" width="48.24" height="23" rx="7"/></clipPath>
  </defs>
  <style>
    .sheen { animation: sheen 2.8s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes sheen {
      0% { transform: translateX(-20px); opacity: 0 }
      20%, 80% { opacity: .55 }
      100% { transform: translateX(83.24px); opacity: 0 }
    }
    @keyframes pulse { 0%, 100% { opacity: 0 } 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .sheen, .pulse { animation: none } }
  </style>
  <g clip-path="url(#chip)">
    <rect x=".5" y=".5" width="48.24" height="23" rx="7" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="48.24" height="11.5" fill="url(#gloss)"/>
    <g class="sheen" opacity="0"><rect x="-10" y="-8" width="12" height="40" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>
  <rect x=".5" y=".5" width="48.24" height="23" rx="7" fill="none" stroke="#EE9DB0" stroke-width="1"/>
  <rect class="pulse" x=".8" y=".8" width="46.64" height="22.4" rx="6.2" fill="none" stroke="#F43F5E" stroke-width="1.4" opacity="0"/>
  <g transform="translate(4.5 5.5) scale(0.5416667)" fill="none" stroke="#D31146" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.5 3 8 9l4 13 4-13-2.5-6" /> <path d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z" /> <path d="M2 9h20" />
  </g>
  <text x="22" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing=".01em" fill="#981036" textLength="21.74" lengthAdjust="spacingAndGlyphs">God</text>
</svg>
