<svg xmlns="http://www.w3.org/2000/svg" width="66.23" height="24" viewBox="0 0 66.23 24" role="img" aria-label="Legend">
  <title>Legend</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E8FE"/>
      <stop offset="1" stop-color="#E1D1FC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chip"><rect x=".5" y=".5" width="65.23" height="23" rx="7"/></clipPath>
  </defs>
  <style>
    .sheen { animation: sheen 2.8s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes sheen {
      0% { transform: translateX(-20px); opacity: 0 }
      20%, 80% { opacity: .55 }
      100% { transform: translateX(100.23px); opacity: 0 }
    }
    @keyframes pulse { 0%, 100% { opacity: 0 } 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .sheen, .pulse { animation: none } }
  </style>
  <g clip-path="url(#chip)">
    <rect x=".5" y=".5" width="65.23" height="23" rx="7" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="65.23" height="11.5" fill="url(#gloss)"/>
    <g class="sheen" opacity="0"><rect x="-10" y="-8" width="12" height="40" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>
  <rect x=".5" y=".5" width="65.23" height="23" rx="7" fill="none" stroke="#C3A2F3" stroke-width="1"/>
  <rect class="pulse" x=".8" y=".8" width="63.63" height="22.4" rx="6.2" fill="none" stroke="#A855F7" stroke-width="1.4" opacity="0"/>
  <g transform="translate(4.5 5.5) scale(0.5416667)" fill="none" stroke="#8B2FD0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
