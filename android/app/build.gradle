plugins {
    id 'com.android.application'
}

android {
    namespace 'com.turkchan.app'
    compileSdk 34

    // Sunucu adresi build zamanında verilir:
    //   Yerel geliştirme : ./gradlew :app:assembleRelease -PserverUrl=http://localhost:3000
    //   Canlı sunucu     : ./gradlew :app:assembleRelease -PserverUrl=https://alan-adiniz
    // Verilmezse uygulama ilk açılışta adresi kullanıcıdan sorar.
    def serverUrl = (project.findProperty('serverUrl') ?: '').toString().trim()

    defaultConfig {
        applicationId 'com.turkchan.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // Türkçe kaynaklar varsayılan; İngilizce yedek eklenmedi.
        resConfigs 'tr', 'en'
        // Boş bırakılırsa MainActivity ilk açılışta diyalog açar.
        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Anahtarlar depoya GİRMEZ. android/keystore/ altında, .gitignore'da.
            def store = rootProject.file('keystore/turkchan-release.jks')
            if (store.exists()) {
                storeFile store
                storePassword project.findProperty('storePassword') ?: 'turkchan'
                keyAlias project.findProperty('keyAlias') ?: 'turkchan'
                keyPassword project.findProperty('keyPassword') ?: 'turkchan'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('keystore/turkchan-release.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Yalnızca `debug` derlemesi src/dev altındaki gevşek ağ yapılandırmasını
    // kullanır (özel LAN adreslerine düz metin). `release` her zaman src/main
    // içindeki katı yapılandırmayı kullanır: yalnızca loopback istisnası.
    sourceSets {
        debug {
            res.srcDirs += 'src/dev/res'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // APK boyutu: yalnızca gerekli kaynaklar pakete girsin.
    packagingOptions {
        resources {
            excludes += ['META-INF/**', 'kotlin/**', '**/*.kotlin_metadata', 'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Tek bağımlılık: androidx FileProvider. Kamera ile çekilen fotoğrafın
// WebView'a URI olarak aktarılması için zorunludur; başka hiçbir şey
// kütüphaneden gelmez (APK küçük kalır).
dependencies {
    implementation 'androidx.core:core:1.13.1'
    // Release APK'ya yalnızca test sınıfları için; uygulama paketine girmez.
    testImplementation 'junit:junit:4.13.2'
}
