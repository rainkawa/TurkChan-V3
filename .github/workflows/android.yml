name: Android APK

# GitHub'da Android release APK derler. İmza anahtarı deponun secrets'ında
# tutulur; secrets tanımlı değilse APK imzasız (unsigned) derlenir.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/generate-android-assets.mjs'
      - 'package.json'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/generate-android-assets.mjs'
  workflow_dispatch:
    inputs:
      serverUrl:
        description: 'Uygulamanın bağlanacağı HTTPS sunucu adresi'
        required: false
        default: 'https://turkchan.app'

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK bileşenlerini kur
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Gradle wrapper'ı kullan
        uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/turkchan-release.jks
            echo "İmza anahtarı bulundu."
          else
            echo "ANDROID_KEYSTORE_BASE64 tanımlı değil; APK imzasız derlenecek."
          fi

      - name: Release APK derle
        env:
          SERVER_URL: ${{ github.event.inputs.serverUrl || 'https://turkchan.app' }}
        run: |
          ./gradlew :app:assembleRelease \
            -PserverUrl="$SERVER_URL" \
            ${{ secrets.ANDROID_KEYSTORE_BASE64 && format('-PstorePassword={0} -PkeyAlias={1} -PkeyPassword={2}', secrets.ANDROID_KEYSTORE_PASSWORD, secrets.ANDROID_KEY_ALIAS, secrets.ANDROID_KEY_PASSWORD) || '' }}

      - name: APK doğrula
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -5

      - name: APK'yı çıktıya ekle
        uses: actions/upload-artifact@v4
        with:
          name: turkchan-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: GitHub Release yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: TurkChan Android ${{ github.run_number }}
          body: |
            TurkChan Android paketi — package `com.turkchan.app`, minSdk 24, targetSdk 34.
          files: android/app/build/outputs/apk/release/app-release.apk
